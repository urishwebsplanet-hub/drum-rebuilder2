<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;color:#eee;background:#101827;margin:0;padding:12px}button{padding:14px;border:0;border-radius:9px;background:#ff5b65;color:white;font-weight:bold;font-size:16px;margin-right:8px}button:disabled{opacity:.45}p{font-size:14px;line-height:1.5}meter{width:100%;height:22px}</style></head><body>
<button id="start">Record music</button><button id="stop" disabled>Stop</button><p id="status">Music mode · uncompressed WAV · maximum 90 seconds</p><meter id="level" min="0" max="1" value="0"></meter><p id="settings">Speech processing will be requested off.</p>
<script>
const start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status'),settings=document.getElementById('settings'),level=document.getElementById('level');
function send(type,data={}){parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:230});
let stream,ctx,source,processor,mute,chunks=[],samples=0,active=false,timer,actual={};
function wav(parts,rate){const count=parts.reduce((n,p)=>n+p.length,0),buffer=new ArrayBuffer(44+count*2),v=new DataView(buffer);function str(o,s){for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}str(0,'RIFF');v.setUint32(4,36+count*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,count*2,true);let o=44;for(const p of parts)for(const x of p){const s=Math.max(-1,Math.min(1,x));v.setInt16(o,s<0?s*32768:s*32767,true);o+=2}return new Blob([buffer],{type:'audio/wav'})}
async function cleanup(){clearInterval(timer);if(processor){processor.onaudioprocess=null;processor.disconnect()}source?.disconnect();mute?.disconnect();stream?.getTracks().forEach(t=>t.stop());if(ctx&&ctx.state!=='closed')await ctx.close();level.value=0}
async function finish(){if(!active)return;active=false;stop.disabled=true;status.textContent='Preparing recording…';const rate=ctx.sampleRate,parts=chunks;await cleanup();try{if(!samples)throw Error('No audio captured. Please try again.');const blob=wav(parts,rate);const reader=new FileReader();reader.onload=()=>{send('streamlit:setComponentValue',{value:{wav:reader.result.split(',')[1],settings:actual,sample_rate:rate},dataType:'json'});status.textContent='Recording ready below. Listen before analyzing.';start.disabled=false};reader.onerror=()=>{status.textContent='Could not prepare recording. Try again.';start.disabled=false};reader.readAsDataURL(blob)}catch(e){status.textContent=e.message;start.disabled=false}chunks=[]}
start.onclick=async()=>{start.disabled=true;status.textContent='Allow microphone access…';try{ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1,sampleRate:{ideal:48000}},video:false});actual=stream.getAudioTracks()[0].getSettings();const labels={echoCancellation:'Echo cancellation',noiseSuppression:'Noise suppression',autoGainControl:'Auto gain'};settings.textContent=Object.entries(labels).map(([k,v])=>v+': '+(actual[k]===false?'off':actual[k]===true?'ON':'unconfirmed')).join(' · ');chunks=[];samples=0;source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(4096,1,1);mute=ctx.createGain();mute.gain.value=0;active=true;const rate=ctx.sampleRate;processor.onaudioprocess=e=>{if(!active)return;const data=e.inputBuffer.getChannelData(0),remaining=Math.floor(90*rate)-samples,p=data.slice(0,Math.max(0,remaining));chunks.push(p);samples+=p.length;let peak=0;for(const x of p)peak=Math.max(peak,Math.abs(x));level.value=peak;status.textContent='Recording '+(samples/rate).toFixed(1)+' / 90 s · '+(peak>.98?'Too loud—lower speaker volume':peak<.005?'Very quiet—move closer':'Level OK');if(samples>=90*rate)finish()};source.connect(processor);processor.connect(mute);mute.connect(ctx.destination);stop.disabled=false;timer=setInterval(()=>{if(ctx.state==='suspended'&&active)finish()},1000)}catch(e){active=false;await cleanup();status.textContent='Microphone unavailable: '+e.message+'. You can use Upload instead.';start.disabled=false}};
stop.onclick=finish;document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)finish()});window.addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop());ctx?.close()});
</script></body></html>
